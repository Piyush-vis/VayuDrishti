services:
  mongodb:
    image: mongo:7
    container_name: vayudrishti-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vayudrishti-backend
    ports:
      - "8000:8000"
    # Reads API keys (GEMINI_API_KEY, AQICN_API_KEY, etc.) from backend/.env - the same
    # file the README's manual setup instructions ask you to create. The explicit
    # `environment:` overrides below win over env_file, so Mongo/CORS are still
    # correctly repointed at the container network regardless of what's in that file.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=vayudrishti
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vayudrishti-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
